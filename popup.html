<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>YouTube Tab Playlist Sorter</title>
  <style>
    :root {
      --bg-color: #0f0f0f;
      --card-bg: #181818;
      --accent-color: #ff0000;
      --accent-hover: #cc0000;
      --text-main: #f1f1f1;
      --text-muted: #aaaaaa;
      --border-color: #2a2a2a;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      width: 380px;
      height: 540px;
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      overflow: hidden;
    }

    body {
      width: 380px;
      height: 540px;
      margin: 0;
      padding: 14px;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
      width: 100%;
    }

    .header img {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }

    .header h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    .tab-counter {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12.5px;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      width: 100%;
    }

    .tab-counter strong {
      color: var(--text-main);
      font-size: 14px;
    }

    .field-group {
      margin-bottom: 9px;
      flex-shrink: 0;
      width: 100%;
    }

    label {
      display: block;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    select, input[type="text"] {
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s;
      text-overflow: ellipsis;
    }

    select:focus, input[type="text"]:focus {
      border-color: var(--accent-color);
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-main);
      cursor: pointer;
      text-transform: none;
      letter-spacing: normal;
      margin-bottom: 0;
    }

    .checkbox-label input[type="checkbox"] {
      width: 15px;
      height: 15px;
      accent-color: var(--accent-color);
      cursor: pointer;
      flex-shrink: 0;
    }

    .btn-submit {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: none;
      background: var(--accent-color);
      color: #ffffff;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 4px;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    .btn-submit:hover {
      background: var(--accent-hover);
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    .btn-submit:disabled {
      background: #444444;
      cursor: not-allowed;
    }

    .progress-bar {
      width: 100%;
      height: 3px;
      background: #2a2a2a;
      border-radius: 2px;
      margin-bottom: 6px;
      overflow: hidden;
      display: none;
      flex-shrink: 0;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent-color);
      transition: width 0.2s ease-out;
    }

    .log-container {
      flex: 1;
      min-height: 80px;
      overflow-y: auto;
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.4;
      background: #121212;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 10px;
      word-break: break-word;
      width: 100%;
    }

    .log-container::-webkit-scrollbar {
      width: 5px;
    }

    .log-container::-webkit-scrollbar-thumb {
      background: #444444;
      border-radius: 3px;
    }

    .video-item {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
      border-bottom: 1px dotted #282828;
    }

    .video-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 230px;
    }

    .video-duration {
      color: #00d26a;
      font-weight: bold;
      margin-left: 8px;
      flex-shrink: 0;
    }

    .playlist-link {
      color: #00d26a;
      font-weight: bold;
      font-size: 12px;
      text-decoration: underline;
      margin-top: 6px;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icon.svg" alt="Icon">
    <h2>YouTube Playlist Sorter</h2>
  </div>

  <div class="tab-counter" id="counterContainer">
    <span>Выделено видео:</span>
    <strong id="ytTabCount">0</strong>
  </div>

  <div class="field-group">
    <label for="playlistType">Режим работы</label>
    <select id="playlistType">
      <option value="account_new">⭐ Новый плейлист в аккаунте</option>
      <option value="account_existing">🔄 Добавить в имеющийся плейлист</option>
      <option value="convert_temp">💾 Сохранить временный в аккаунт</option>
      <option value="temp">⚡ Временный список (watch_videos)</option>
    </select>
  </div>

  <div class="field-group" id="titleGroup">
    <label for="playlistTitle">Название плейлиста</label>
    <input type="text" id="playlistTitle" value="Мой отсортированный плейлист">
  </div>

  <div class="field-group" id="existingGroup" style="display: none;">
    <label for="targetPlaylistSelect">Выберите имеющийся плейлист</label>
    <select id="targetPlaylistSelect">
      <!-- Populated dynamically -->
    </select>
  </div>

  <div class="field-group" id="tempSelectGroup" style="display: none;">
    <label for="targetTempSelect">Выберите временный плейлист</label>
    <select id="targetTempSelect">
      <!-- Populated dynamically -->
    </select>
  </div>

  <div class="field-group" id="privacyGroup">
    <label for="playlistPrivacy">Доступ</label>
    <select id="playlistPrivacy">
      <option value="PRIVATE">🔒 Приватный (только для меня)</option>
      <option value="UNLISTED">🔗 По ссылке</option>
      <option value="PUBLIC">🌐 Публичный</option>
    </select>
  </div>

  <div class="field-group" id="sortGroup">
    <label for="sortOrder">Сортировка по длительности</label>
    <select id="sortOrder">
      <option value="asc">⏱️ От коротких к длинным (▲)</option>
      <option value="desc">⏳ От длинных к коротким (▼)</option>
      <option value="none">➡️ Сохранить исходный порядок</option>
    </select>
  </div>

  <div class="field-group">
    <label class="checkbox-label">
      <input type="checkbox" id="closeOriginalTabs">
      Закрыть обработанные вкладки
    </label>
  </div>

  <button id="createBtn" class="btn-submit">
    <span id="btnText">Создать плейлист в аккаунте</span>
  </button>

  <div class="progress-bar" id="progressBar">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="log-container" id="logContainer">
    Выделите вкладки с видео (Ctrl/Shift + Клик) и нажмите кнопку.
  </div>

  <script src="popup.js"></script>
</body>
</html>
